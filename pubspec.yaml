name: cogni_boost
description: A new Flutter project for brain training games.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Adjusted to a common modern Dart SDK range

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  google_mobile_ads: ^6.0.0
  firebase_core: ^3.13.1
  hive: ^2.2.3 # Or the latest stable version
  hive_flutter: ^1.1.0
  fl_chart: ^0.68.0
  firebase_remote_config: ^5.4.4 # Use the latest stable version
  google_fonts: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.1 # Or the latest stable version
  build_runner: ^2.4.10 # Or the latest stable version

flutter:
  uses-material-design: true
